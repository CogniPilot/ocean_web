name: ocean_web
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: CogniPilot/microduck_web
          ref: f567b8c452d5c759436a568ffad5632dc1046916
          path: .deps/microduck_web
      - uses: actions/checkout@v4
        with:
          repository: CogniPilot/electrode_web
          ref: 626c38c96933010210c030aaad96db7f694dba9a
          path: .deps/electrode-web
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --prefix .deps/ocean-component --no-save @bytecodealliance/jco-transpile@0.23.0
      - name: Build the on-demand RDD2 ground station
        working-directory: .deps/electrode-web
        env:
          ELECTRODE_WEB_BASE_PATH: /${{ github.event.repository.name }}/electrode
        run: |
          git apply "$GITHUB_WORKSPACE/patches/electrode-web-embedded.patch"
          npm ci
          npm run build
      - run: scripts/package-pages.sh build/pages --world
        env:
          OCEAN_ELECTRODE_URL: /${{ github.event.repository.name }}/electrode/
          OCEAN_LOBBY_ENDPOINT: ${{ vars.OCEAN_LOBBY_ENDPOINT }}
          OCEAN_TURN_ENDPOINT: ${{ vars.OCEAN_TURN_ENDPOINT }}
      - run: cp -a .deps/electrode-web/apps/web/build build/pages/electrode
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Wait for the Pages artifact to appear in the run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | grep -q .; then
              exit 0
            fi
            sleep 5
          done
          exit 1
      - uses: actions/deploy-pages@v4
        id: publish
