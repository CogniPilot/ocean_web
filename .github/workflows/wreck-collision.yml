name: Wreck collision replay
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/wreck-collision.yml'
      - 'viewer/convex-scan.mjs'
      - 'viewer/wreck-contact.mjs'
      - 'viewer/piccard-geometry.mjs'
      - 'viewer/assets/red-sea/*/collision.json'
      - 'scripts/check-scan-primitives.mjs'
      - 'tools/bench-wreck-parry/**'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/bench-wreck-parry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
      - run: cargo +1.95.0 build --locked --release
      - run: cargo +1.95.0 build --locked --release --lib --target wasm32-unknown-unknown
      - run: node ../../scripts/check-scan-primitives.mjs
      - run: node compare.mjs target/release/wreck-scan-parry-query target/wasm32-unknown-unknown/release/parry_wreck_wasm.wasm
