name: Multiplayer browsers
on:
  workflow_dispatch:
  pull_request:
    paths: ['viewer/fleet*.mjs', 'viewer/npc-room.mjs', 'viewer/lap-board.mjs', 'viewer/vendor/trystero.mjs', 'scripts/check-fleet*', 'scripts/check-npc-room.mjs', '.github/workflows/multiplayer.yml']
  push:
    branches: [main]
    paths: ['viewer/fleet*.mjs', 'viewer/npc-room.mjs', 'viewer/lap-board.mjs', 'viewer/vendor/trystero.mjs', 'scripts/check-fleet*', 'scripts/check-npc-room.mjs', '.github/workflows/multiplayer.yml']
permissions:
  contents: read
jobs:
  native-webrtc:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, engine: chromium}
          - {os: ubuntu-24.04, engine: firefox}
          - {os: macos-latest, engine: webkit}
          - {os: windows-latest, engine: chromium}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save playwright@1.56.1 ws@8.18.3
      - run: npx playwright install --with-deps chromium ${{ matrix.engine }}
      - run: node scripts/check-fleet-room.mjs
      - run: node scripts/check-npc-room.mjs
      - run: node scripts/check-fleet-browser.cjs ${{ matrix.engine }}
