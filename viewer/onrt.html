<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ONR Tumblehome · Ocean Web</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#b1c7d0;color:#e8f3f4;font:15px system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}aside{position:absolute;left:1rem;top:1rem;width:min(21rem,calc(100% - 2rem));background:#102933f2;padding:1rem;border-radius:.5rem;box-shadow:0 2px 16px #112f3840}h1{font:1.7rem Georgia,serif;margin:0 0 .2rem}p{margin:.25rem 0 .75rem}small,summary,a{color:#b1e5dc}summary{cursor:pointer}[hidden]{display:none!important}label{display:block;margin:.5rem 0}input[type=range]{width:100%;accent-color:#7ad7c0}output{float:right}button,select,a{font:inherit}button,select{background:#20414b;color:white;border:1px solid #648f94;border-radius:.25rem;padding:.35rem}button{cursor:pointer}.row{display:flex;gap:.35rem;flex-wrap:wrap;margin:.5rem 0}#readout{font: .8rem/1.55 ui-monospace,monospace;white-space:pre-line;margin:.4rem 0}footer{font-size:.78rem;margin-top:.8rem}#distance{position:absolute;bottom:1rem;right:1rem;background:#102933df;border-radius:.3rem;padding:.35rem .65rem;font:12px monospace}@media(max-height:580px){aside{max-height:94vh;overflow:auto}}@media(max-width:580px){aside{left:.5rem;right:.5rem;bottom:.5rem;top:auto;width:auto;max-height:46vh;overflow:auto;padding:.65rem}#distance{top:.5rem;bottom:auto}}
</style></head><body><canvas id="view" aria-label="ONR Tumblehome in the model basin"></canvas>
<aside><h1>ONR Tumblehome</h1><small>IIHR model 5613 · 3.147 m LWL · 72.6 kg</small>
<div id="readout" aria-live="off">Loading vessel and wave solver…</div>
<details open><summary>Helm and experiment</summary>
<label>Run <select id="mode"><option value="drive">Free running</option><option value="tow">Straight tow</option></select></label>
<label hidden id="towControl">Tow speed <output id="towLabel">1.11 m/s</output><input id="towSpeed" type="range" min=".25" max="2.25" value="1.11" step=".01"></label>
<label>Shaft command <output id="shaftLabel">0 rpm</output><input id="shaft" type="range" min="0" max="900" value="0" step="1"></label>
<label>Helm <output id="helmLabel">Amidships</output><input id="helm" type="range" min="-35" max="35" value="0" step="1"></label>
<label>Incident waves <select id="waves"><option value="calm">Calm water</option><option value="180">Head seas</option><option value="135">Bow quarter</option><option value="90">Beam seas</option><option value="45">Stern quarter</option><option value="0">Following seas</option></select></label>
<div class="row"><button id="design">538 rpm</button><button id="center">Center helm</button><button id="reset">Reset run</button></div>
<label>Keyboard layout <select id="keyLayout"><option value="wasd">WASD + Q/E + R/F</option><option value="mode2">WASD + arrows (Mode 2)</option></select></label>
<small>W/S adjust shaft speed. A/D steer. Drag to orbit and scroll or pinch to zoom.</small>
</details><div class="row"><label><input type="checkbox" id="contours"> Wake contours</label><button id="recenter">Re-center view</button><button id="save" disabled>Export wave cuts</button></div>
<footer><a href="./onrt-propeller.html">3D propeller flow</a> · <a href="./">Ocean Web models</a> · <a href="https://t2015.nmri.go.jp/onrt_gc.html">Experiment particulars</a></footer></aside>
<span id="distance">40 × 20 × 3 m basin · 1 m grid</span>
<script src="vendor/three.min.js"></script><script type="module" src="onrt-view.mjs"></script></body></html>
